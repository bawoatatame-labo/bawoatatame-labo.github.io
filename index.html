<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>場を温める研究所 実験室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 実験室の入口：各回のページと同じ記録用紙の見た目 */
:root{
  --bg:#eef1f3; --paper:#ffffff; --ink:#1d2733; --sub:#5b6875; --line:#cfd6dc;
  --accent:#e8742a; --accent-ink:#ffffff;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a21; --paper:#1d252e; --ink:#e7edf2; --sub:#9aa7b3; --line:#33404c;
  --accent:#f08a45; --accent-ink:#141a21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a21; --paper:#1d252e; --ink:#e7edf2; --sub:#9aa7b3; --line:#33404c;
  --accent:#f08a45; --accent-ink:#141a21; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.08em;padding:2px 10px;border-radius:3px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--sub);font-size:14px}
.list{display:flex;flex-direction:column;gap:12px}
a.exp{display:flex;flex-direction:column;gap:6px;background:var(--paper);color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:6px;padding:16px}
a.exp:hover,a.exp:focus-visible{border-color:var(--accent);outline:none}
a.exp .no{font-family:var(--f-mono);color:var(--accent);font-size:13px}
a.exp b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
</style>

<div class="wrap">
  <section class="sheet">
    <span class="tag">場を温める研究所</span>
    <h1>実験室</h1>
    <p>動画で紹介した研究を、自分で試せる部屋です。やってみると、みんなの結果も見られます。</p>
    <p class="sub">送るのは答えの数字だけ。名前やメールは聞きません。</p>
  </section>
  <nav class="list" id="list" aria-label="実験の一覧"></nav>
</div>

<script>
// 実験を足すときはここに 1 行足す（新しい順に上へ）
const EXPS = [
  { no: "研究回 #4", path: "04-first-impression/", title: "第一印象は最初の数秒で決まる？",
    desc: "0.1 秒と 1 秒で、顔の印象は変わる？／悪い第一印象は、ひっくり返せる？" },
];
const list = document.getElementById("list");
EXPS.forEach((x) => {
  const a = document.createElement("a");
  a.className = "exp"; a.href = x.path;
  a.innerHTML = '<span class="no"></span><b></b><span class="sub"></span>';
  a.querySelector(".no").textContent = x.no;
  a.querySelector("b").textContent = x.title;
  a.querySelector(".sub").textContent = x.desc;
  list.appendChild(a);
});
</script>

</body>
</html>
